name: Ripoti

on:
  push:
    branches: [main]
    tags: ['ripoti-*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  pdf:
    name: Jenga PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sakinisha tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Jenga kila ripoti (Kiswahili na Kiingereza)
        run: |
          mkdir -p pdf
          for d in ripoti/*/; do
            n="$(basename "$d")"
            (cd "$d" && tectonic ripoti.tex && tectonic report.tex)
            cp "$d/ripoti.pdf" "pdf/$n-sw.pdf"
            cp "$d/report.pdf" "pdf/$n-en.pdf"
          done
          ls -la pdf

      - uses: actions/upload-artifact@v4
        with:
          name: ripoti
          path: pdf/

      - name: Toleo (lebo ripoti-*)
        if: startsWith(github.ref, 'refs/tags/ripoti-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pdf/*.pdf --title "$GITHUB_REF_NAME" --notes "PDF zilizojengwa kutoka chanzo cha LaTeX kwenye lebo hii."
